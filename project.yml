name: Waffi
options:
  bundleIdPrefix: com.waffieg
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1" # CI overrides with the run number
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is passed on the xcodebuild command line by CI (public repo: no ids committed)

targets:
  Waffi:
    type: application
    platform: iOS
    sources: [App, Shared, Resources]
    dependencies:
      - target: WaffiLiveActivity
      - target: WaffiClip
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waffieg.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Waffi
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Waffi.entitlements
      properties:
        com.apple.developer.associated-domains: ["appclips:waffieg.com", "applinks:waffieg.com"]
        aps-environment: development # Xcode switches it to production when exporting for the App Store
        com.apple.security.application-groups: [group.com.waffieg.app]

  WaffiLiveActivity:
    type: app-extension
    platform: iOS
    sources: [AppLiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waffieg.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
    info:
      path: AppLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Waffi
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleLocalizations: [en, ar]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AppLiveActivity/WaffiLiveActivity.entitlements
      properties:
        com.apple.security.application-groups: [group.com.waffieg.app]

  WaffiClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: [Clip, Shared, Resources]
    dependencies:
      - target: WaffiClipLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waffieg.app.Clip
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Clip/Info.plist
      properties:
        CFBundlePackageType: APPL
        CFBundleDisplayName: Waffi
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: true
          NSAppClipRequestLocationConfirmation: false
    entitlements:
      path: Clip/WaffiClip.entitlements
      properties:
        com.apple.developer.associated-domains: ["appclips:waffieg.com", "applinks:waffieg.com"]
        com.apple.developer.parent-application-identifiers: ["$(AppIdentifierPrefix)com.waffieg.app"]
        aps-environment: development
        com.apple.security.application-groups: [group.com.waffieg.app]

  WaffiClipLiveActivity:
    type: app-extension
    platform: iOS
    sources: [ClipLiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waffieg.app.Clip.LiveActivity
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
    info:
      path: ClipLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Waffi
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleLocalizations: [en, ar]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ClipLiveActivity/WaffiClipLiveActivity.entitlements
      properties:
        com.apple.developer.on-demand-install-capable: true
        com.apple.security.application-groups: [group.com.waffieg.app]
