name: build

on:
  push:
  pull_request:

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          ls /Applications | grep Xcode
          XCODE=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild build \
            -project Waffi.xcodeproj -scheme Waffi \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
